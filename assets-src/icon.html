<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 256px; height: 256px; overflow: hidden; }
  body {
    background: #101014;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 42%, rgba(255,61,19,0.30) 0%, transparent 68%);
  }
  img {
    position: relative;
    width: 132px;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <img src="symbol-light.svg" alt="Ranki">
</body>
</html>
