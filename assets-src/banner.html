<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1544px; height: 500px; overflow: hidden; }
  body {
    background: #101014;
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
  }

  /* Warm glow behind the text block so the dark field is not flat */
  .glow {
    position: absolute;
    left: -180px; top: -220px;
    width: 1100px; height: 900px;
    background: radial-gradient(circle, rgba(255,61,19,0.20) 0%, transparent 62%);
    filter: blur(20px);
  }
  .glow-2 {
    position: absolute;
    right: -260px; bottom: -320px;
    width: 900px; height: 800px;
    background: radial-gradient(circle, rgba(255,61,19,0.13) 0%, transparent 65%);
  }

  .wrap {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 620px;
    align-items: center;
    gap: 60px;
    height: 100%;
    padding: 0 0 0 96px;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px; font-weight: 600;
    letter-spacing: 0.20em; text-transform: uppercase;
    color: #FF3D13;
    margin-bottom: 26px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #FF3D13; box-shadow: 0 0 14px rgba(255,61,19,0.9); }

  h1 {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-weight: 800;
    font-size: 68px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    color: #ffffff;
    margin-bottom: 26px;
  }
  h1 .accent { color: #FF3D13; }

  .sub {
    font-size: 25px;
    font-weight: 400;
    line-height: 1.4;
    color: rgba(255,255,255,0.62);
    margin-bottom: 40px;
    max-width: 640px;
  }
  .sub strong { color: #ffffff; font-weight: 600; }

  .logo { height: 42px; display: block; }

  /* ── Right: live feed card ───────────────────────────────── */
  .card {
    background: #1a1a20;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 22px;
    padding: 24px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    width: 620px;
    margin-right: -60px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a42; display: block; }
  .card-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; color: rgba(255,255,255,0.38);
  }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 12px #34d399; }

  .row {
    background: #101014;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .row:last-child { margin-bottom: 0; }
  .row-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 11px;
  }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    color: #FF3D13;
  }
  .tag.green { color: #34d399; }
  .time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.32); letter-spacing: 0.06em;
  }
  .row h4 {
    font-size: 20px; font-weight: 700; color: #ffffff;
    letter-spacing: -0.02em; line-height: 1.25;
  }
  .row p { font-size: 15px; color: rgba(255,255,255,0.55); line-height: 1.4; }
  .chips { display: flex; gap: 8px; margin-top: 13px; }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.08em;
    color: #FF3D13;
    padding: 5px 10px;
    background: rgba(255,61,19,0.09);
    border: 1px solid rgba(255,61,19,0.28);
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>

  <div class="wrap">
    <div>
      <div class="eyebrow"><span class="dot"></span> WordPress Publishing Bridge</div>

      <h1>
        Your articles, published<br>
        <span class="accent">on autopilot.</span>
      </h1>

      <p class="sub">
        And every call they bring in, <strong>tracked</strong>.
      </p>

      <img class="logo" src="logo-white.svg" alt="Ranki">
    </div>

    <div class="card">
      <div class="card-head">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="card-label">RANKI · LIVE</div>
        <div class="live"></div>
      </div>

      <div class="row">
        <div class="row-top">
          <span class="tag">● PUBLISHED</span>
          <span class="time">2m ago</span>
        </div>
        <h4>Why Mosman sellers are choosing<br>buyers agents in 2026</h4>
        <div class="chips">
          <span class="chip">FEATURED IMAGE</span>
          <span class="chip">META + SCHEMA</span>
        </div>
      </div>

      <div class="row">
        <div class="row-top">
          <span class="tag green">● ENQUIRY TRACKED</span>
          <span class="time">just now</span>
        </div>
        <p>Phone tap from the article above</p>
      </div>
    </div>
  </div>
</body>
</html>
